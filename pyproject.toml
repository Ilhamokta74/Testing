[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Local/offline video clipper: long video -> vertical 9:16 clips with captions"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp",
  "faster-whisper",
  "numpy",
  "pyyaml",
  "typer",
  "rich",
  "rapidfuzz",
]

[project.optional-dependencies]
llm = ["llama-cpp-python"]
vision = ["opencv-python", "mediapipe", "scenedetect"]
dev = ["pytest"]

[project.scripts]
clipper = "clipper.cli:app"

[tool.setuptools.packages.find]
include = ["clipper*"]
